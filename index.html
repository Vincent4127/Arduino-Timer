<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench Timer | IEEE UOB Student Branch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@700&family=Roboto+Mono:wght@500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     IEEE UOB Student Branch, bench timer.
     Every value is hardcoded from the branch's design system, so this
     file stands alone. Fonts fall back to system faces offline.
     ============================================================ */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    /* Stage: IEEE brand blue #00629B, as on the branch website */
    --stage:        #00629B;
    --stage-deep:   #015C92;
    --stage-glow:   #1A72A5;

    /* Ink on the blue stage */
    --ink:          #FFFFFF;
    --ink-soft:     #E3F3FF;
    --ink-accent:   #C7E4FA;

    /* The neon wireframe palette the Engineering Complex is drawn in */
    --neon-core:    #C7E4FA;
    --neon-line:    #8FC8F2;
    --neon-glow:    #1085E4;

    /* Glass surfaces */
    --glass:        rgba(255, 255, 255, 0.06);
    --glass-edge:   rgba(255, 255, 255, 0.16);
    --glass-edge-2: rgba(255, 255, 255, 0.28);
    --screen:       rgba(8, 24, 47, 0.62);

    /* Actions */
    /* Start: the design system's success green, as a gradient so it keeps
       the same pill treatment as every other action. Built around #137C3B
       and kept dark enough to hold white text at the label. */
    --go-grad:          linear-gradient(135deg, #16924A 0%, #0E6A30 100%);
    --go-grad-hover:    linear-gradient(135deg, #1AA353 0%, #117A38 100%);
    --stop:             #C0341D;
    --stop-hover:       #A82C18;
    --live:             #4ADE80;

    --font-display: 'Karla', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body:    'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-digits:  'Roboto Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

    --radius-md:   10px;
    --radius-lg:   15px;
    --radius-full: 999px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: inherit; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 16px;
    overflow-x: hidden;
    /* Same stage as the website's hero: a pool of light behind the
       timer, deepening toward the corners. */
    background:
      radial-gradient(120% 90% at 50% 40%, var(--stage-glow) 0%, transparent 62%),
      linear-gradient(160deg, var(--stage) 0%, var(--stage-deep) 100%);
    background-attachment: fixed;
  }

  /* A faint drawn ring behind everything, the hero's arc motif */
  body::before {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(88vw, 620px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 1px solid var(--neon-glow);
    border-radius: 50%;
    opacity: .22;
    pointer-events: none;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }

  /* ---- Brand lockup ---- */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .brand img {
    height: 46px;
    width: auto;
    display: block;
    /* The lockup is IEEE blue; rendered white on the blue stage */
    filter: brightness(0) invert(1);
  }

  /* Eyebrow: uppercase, letterspaced, a rule on each side */
  .eyebrow,
  .label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }
  .eyebrow::before, .eyebrow::after,
  .label::before, .label::after {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--neon-line);
    opacity: .8;
    flex: none;
  }

  /* ---- The device: a glass panel on the stage ---- */
  .device {
    width: 100%;
    max-width: 400px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    border-radius: 20px;
    padding: 24px;
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 24px 60px rgba(4, 12, 26, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  /* Small text on the glass sits on the lightest part of the stage, where
     the pale blue falls under 4.5:1, so it is white here. */
  .label { margin: 0 0 16px; color: var(--ink); }

  /* ---- Screen: deep glass, digits lit like the building's edges ---- */
  .screen {
    position: relative;
    background: var(--screen);
    border: 1px solid var(--glass-edge);
    border-radius: var(--radius-lg);
    padding: 30px 12px 22px;
    text-align: center;
    box-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  /* A soft glow pool behind the digits */
  .screen::before {
    content: '';
    position: absolute;
    inset: -30% -10% auto;
    height: 120%;
    background: radial-gradient(50% 45% at 50% 50%, rgba(16, 133, 228, 0.28) 0%, transparent 70%);
    pointer-events: none;
  }
  .digits {
    position: relative;
    font-family: var(--font-digits);
    font-weight: 500;
    font-size: clamp(48px, 15vw, 60px);
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    color: var(--ink);
    /* Filament, then halo: reads as emitted light, not a drop shadow */
    text-shadow:
      0 0 6px var(--neon-core),
      0 0 18px var(--neon-glow),
      0 0 36px rgba(16, 133, 228, 0.55);
  }
  .digits .ms { font-size: 0.56em; opacity: 0.85; }
  .units {
    position: relative;
    margin-top: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-accent);
  }

  /* ---- Buttons: the site's pill buttons ---- */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  button {
    font: inherit;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 700;
    min-height: 48px;
    padding: 12px 18px;
    border-radius: var(--radius-full);
    border: 1px solid rgba(255, 255, 255, 0.38);
    cursor: pointer;
    color: var(--ink);
    background: transparent;
    transition:
      transform 0.12s var(--ease),
      background 0.2s var(--ease),
      border-color 0.2s var(--ease),
      box-shadow 0.2s var(--ease);
  }
  button:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.10);
    border-color: rgba(255, 255, 255, 0.62);
  }
  button:active:not(:disabled) { transform: scale(0.97); background: rgba(255, 255, 255, 0.16); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Start: green, so go and stop read at a glance as green and red */
  #toggleBtn.go {
    background: var(--go-grad);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(14, 106, 48, 0.45);
  }
  #toggleBtn.go:hover { background: var(--go-grad-hover); box-shadow: 0 6px 20px rgba(14, 106, 48, 0.55); }
  /* Stop: the system's danger red, so the running state is unmissable */
  #toggleBtn.stop {
    background: var(--stop);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(192, 52, 29, 0.42);
  }
  #toggleBtn.stop:hover { background: var(--stop-hover); }

  /* ---- Arduino row ---- */
  .arduino {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--glass-edge);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #connectBtn { flex: 1; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    min-width: 96px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.32);
    flex: none;
    transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .dot.on { background: var(--live); box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.22), 0 0 10px var(--live); }

  .note {
    margin: 14px 0 0;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.5;
  }

  .tagline {
    margin: 0;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }

  @media (max-width: 380px) {
    .device { padding: 18px; }
    .arduino { flex-wrap: wrap; }
    #connectBtn { flex-basis: 100%; }
  }


  /* ============================================================
     PC: scoreboard layout, 1024px and wider only.
     Phones and tablets keep the card layout above, untouched.

     In the game every eye is on the number, so on a large screen the
     number owns the stage: the screen fills most of the window, the
     controls sit large beneath it, and the operator's Arduino controls
     shrink into a footer strip.

     The glass card dissolves into the page (display: contents), so its
     children can be placed on one page grid without changing the markup.
     ============================================================ */
  @media (min-width: 1024px) {
    body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      grid-template-areas:
        "brand    label    .       "
        "screen   screen   screen  "
        "controls controls controls"
        "arduino  note     tagline ";
      align-items: center;
      gap: 24px 32px;
      height: 100vh;
      height: 100dvh;
      padding: 24px 48px 22px;
      overflow: hidden;
    }
    body::before { width: min(78vw, 110vh); opacity: .16; }

    .device {
      display: contents;
    }

    /* ---- Top bar: logo left, the label centred, like the site's navbar */
    .brand {
      grid-area: brand;
      flex-direction: row;
      justify-self: start;
      gap: 16px;
    }
    .brand img { height: 42px; }
    /* Beside the logo the name reads as one line with no rules; below 1280px
       the column is narrower than logo plus name, and the lockup already
       says IEEE UOB Student Branch, so the text steps aside. */
    .brand .eyebrow { white-space: nowrap; }
    .brand .eyebrow::before, .brand .eyebrow::after { content: none; }
    .label { grid-area: label; margin: 0; font-size: 13px; }

    /* ---- The screen: most of the window ---- */
    .screen {
      grid-area: screen;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 24px;
      border-radius: 24px;
      border-color: var(--glass-edge-2);
      box-shadow:
        inset 0 2px 24px rgba(0, 0, 0, 0.35),
        0 30px 80px rgba(4, 12, 26, 0.35);
    }
    .screen::before {
      inset: 0;
      height: auto;
      background: radial-gradient(45% 55% at 50% 50%, rgba(16, 133, 228, 0.30) 0%, transparent 72%);
    }
    /* The number scales with whichever runs out first, width or height, so
       it fills the screen on a wide monitor and a short laptop alike. */
    .digits {
      font-size: min(17vw, 38vh);
      line-height: 1;
      letter-spacing: 0.02em;
    }
    /* The decimals are the score in this game: near full size and full
       brightness, not the dimmed afterthought a normal stopwatch uses. */
    .digits .ms { font-size: 0.8em; opacity: 1; }
    .units { margin-top: 2vh; font-size: 14px; letter-spacing: 0.22em; }

    /* ---- Controls: large, centred under the screen ---- */
    .controls {
      grid-area: controls;
      justify-self: center;
      width: min(620px, 100%);
      margin: 0;
      gap: 16px;
    }
    .controls button { min-height: 64px; font-size: 18px; }

    /* ---- Footer strip: the operator's controls, kept small ---- */
    .arduino {
      grid-area: arduino;
      justify-self: start;
      margin: 0;
      padding: 0;
      border: 0;
    }
    #connectBtn { flex: none; min-height: 40px; padding: 8px 18px; font-size: 13px; }
    .note {
      grid-area: note;
      margin: 0;
      max-width: 520px;
      text-align: center;
      font-size: 12px;
    }
    .tagline { grid-area: tagline; justify-self: end; }

    /* Once the Arduino is connected the setup note has done its job. */
    body:has(.dot.on) .note { visibility: hidden; }

    /* ---- The screen reacts to the game ----
       While the timer runs, a slow glow breathes around the screen's edge.
       The moment it stops, the digits flash bright once: the buzzer press
       is the climax of every round, and it should land visually. */
    .screen::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      border: 2px solid var(--neon-core);
      box-shadow: 0 0 28px rgba(16, 133, 228, 0.65), inset 0 0 28px rgba(16, 133, 228, 0.35);
      opacity: 0;
      pointer-events: none;
    }
    body:has(#toggleBtn.stop) .screen::after {
      animation: runPulse 1400ms ease-in-out infinite;
    }
    body:has(#toggleBtn.go) .digits {
      animation: lockFlash 900ms ease-out;
    }
  }

  @media (min-width: 1024px) and (max-width: 1279px) {
    .brand .eyebrow { display: none; }
  }

  @keyframes runPulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }
  @keyframes lockFlash {
    0%   { text-shadow: 0 0 14px #fff, 0 0 40px var(--neon-core), 0 0 90px var(--neon-glow); }
    100% { text-shadow: 0 0 6px var(--neon-core), 0 0 18px var(--neon-glow), 0 0 36px rgba(16, 133, 228, 0.55); }
  }

  @media (prefers-reduced-motion: reduce) {
    button, .dot { transition: none; }
    button:active:not(:disabled) { transform: none; }
    /* No breathing or flash: the ring simply shows while the timer runs. */
    body:has(#toggleBtn.stop) .screen::after { animation: none; opacity: 1; }
    body:has(#toggleBtn.go) .digits { animation: none; }
  }
</style>
</head>

    <p class="eyebrow">IEEE University of Balamand Student Branch</p>
  </header>

  <div class="device">
    <p class="label">Timer</p>
    <div class="screen">
      <div class="digits" id="display">00<span class="ms">.00</span></div>
      <div class="units">seconds &middot; hundredths</div>
    </div>
    <div class="controls">
      <button id="toggleBtn" class="go">Start</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="arduino">
      <button id="connectBtn">Connect Arduino</button>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Not connected</span></div>
    </div>
    <p class="note" id="note">Pressing your push button sends a signal over USB that presses Start/Stop for you. Works in Chrome or Edge on a computer.</p>
  </div>

  <p class="tagline">Innovate &middot; Inspire &middot; Impact</p>

<script>
  const display = document.getElementById('display');
  const toggleBtn = document.getElementById('toggleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const connectBtn = document.getElementById('connectBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const note = document.getElementById('note');

  let running = false, startTime = 0, elapsed = 0, rafId = null;

  function render(ms) {
    const total = Math.max(0, Math.floor(ms));
    const seconds = Math.floor(total / 1000);
    // Hundredths, truncated rather than rounded, as a stopwatch reads:
    // 1.999 s shows 1.99, never 2.00.
    const hundredths = Math.floor((total % 1000) / 10);
    display.innerHTML = String(seconds).padStart(2, '0') +
      '<span class="ms">.' + String(hundredths).padStart(2, '0') + '</span>';
  }

  function tick() {
    if (!running) return;
    render(elapsed + (performance.now() - startTime));
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (running) return;
    running = true;
    startTime = performance.now();
    toggleBtn.textContent = 'Stop';
    toggleBtn.classList.remove('go');
    toggleBtn.classList.add('stop');
    tick();
  }

  function stop() {
    if (!running) return;
    running = false;
    elapsed += performance.now() - startTime;
    cancelAnimationFrame(rafId);
    toggleBtn.textContent = 'Start';
    toggleBtn.classList.remove('stop');
    toggleBtn.classList.add('go');
  }

  function toggle() { running ? stop() : start(); }

  function reset() {
    stop();
    elapsed = 0;
    render(0);
  }

  toggleBtn.addEventListener('click', toggle);
  resetBtn.addEventListener('click', reset);
  render(0);

  // --- Arduino connection over Web Serial ---
  let port = null, reader = null, keepReading = false;

  if (!('serial' in navigator)) {
    connectBtn.disabled = true;
    statusText.textContent = 'Unsupported browser';
    note.textContent = 'Web Serial isn\'t available here. Open this page in Chrome or Edge on a desktop computer to connect the Arduino.';
  }

  connectBtn.addEventListener('click', async () => {
    if (port) { await disconnectSerial(); return; }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      statusDot.classList.add('on');
      statusText.textContent = 'Connected';
      connectBtn.textContent = 'Disconnect';
      keepReading = true;
      readLoop();
    } catch (err) {
      statusText.textContent = 'Connection cancelled';
      port = null;
    }
  });

  async function readLoop() {
    const decoder = new TextDecoderStream();
    const closed = port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();
    let buffer = '';
    try {
      while (keepReading) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) {
          buffer += value;
          let idx;
          while ((idx = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 1);
            if (line) toggle();
          }
        }
      }
    } catch (e) {
      // device unplugged or read error
    } finally {
      try { reader.releaseLock(); } catch (e) {}
      await closed.catch(() => {});
      if (keepReading) await disconnectSerial();
    }
  }

  async function disconnectSerial() {
    keepReading = false;
    try { await reader?.cancel(); } catch (e) {}
    try { await port?.close(); } catch (e) {}
    port = null;
    statusDot.classList.remove('on');
    statusText.textContent = 'Not connected';
    connectBtn.textContent = 'Connect Arduino';
  }
</script>
